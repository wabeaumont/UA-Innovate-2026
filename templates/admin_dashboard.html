{% extends 'base.html' %}

{% block title %}BlazerSec SOC Dashboard{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <div class="d-flex justify-content-between align-items-center">
            <h2><i class="fas fa-user-shield me-2"></i>SOC Dashboard</h2>
            <a href="{{ url_for('logout') }}" class="btn btn-danger">
                <i class="fas fa-sign-out-alt me-1"></i> Logout
            </a>
        </div>
        <p class="text-muted">System administration and security monitoring</p>
    </div>
</div>

<div class="row">
    <div class="col-md-6 mb-3">
        <a href="{{ url_for('case1') }}" class="text-decoration-none">
            <div class="alert alert-info text-center mb-0">
                <strong>Security Case 1</strong>
                <p class="mb-0 small text-muted" style="white-space: pre-wrap;">{{ event1_description or " " }}</p>
            </div>
        </a>
    </div>
    <div class="col-md-6 mb-3">
        <a href="{{ url_for('case2') }}" class="text-decoration-none">
            <div class="alert alert-info text-center mb-0">
                <strong>Security Case 2</strong>
                <p class="mb-0 small text-muted" style="white-space: pre-wrap;">{{ event2_description or " " }}</p>
            </div>
        </a>
    </div>
</div>
{% endblock %}
